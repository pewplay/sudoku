<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8edf7">
  <title>Sudoku</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app">
    <header class="bar" id="bar">
      <div class="bar-info">
        <span class="brand">Sudoku</span>
        <span class="diff-label" id="diffLabel">Medium</span>
      </div>
      <div class="bar-stats">
        <span class="stat"><span class="stat-k">Time</span> <span class="stat-v" id="time">0:00</span></span>
        <span class="stat"><span class="stat-k">Filled</span> <span class="stat-v" id="filled">0/81</span></span>
      </div>
      <button type="button" class="btn btn-new" id="newBtn">New Game</button>
    </header>

    <div class="board" id="board" role="grid" aria-label="Sudoku board"></div>

    <div class="pad" id="pad">
      <p class="keys"><b>Keyboard:</b> arrows move &middot; 1&ndash;9 place &middot; Shift+1&ndash;9 note &middot; N notes &middot; Del erase &middot; Ctrl+Z undo</p>
      <div class="nums" id="nums"></div>
      <div class="tools">
        <button type="button" class="btn tool" id="undoBtn" title="Undo (Ctrl+Z)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H4V2M4.5 7A8.5 8.5 0 1 1 3.6 14"/></svg><span>Undo</span>
        </button>
        <button type="button" class="btn tool" id="eraseBtn" title="Erase (Delete / Backspace / 0)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20H8l-5-5L14 4l7 7-7 7M9 9l7 7"/></svg><span>Erase</span>
        </button>
        <button type="button" class="btn tool" id="notesBtn" title="Notes mode (N)" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-5L16 4l4 4L9 19zM14 6l4 4"/></svg><span>Notes <b id="notesState">Off</b></span>
        </button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
      <h2 id="dlgTitle">New Game</h2>
      <p id="dlgText"></p>
      <div class="result" id="dlgResult" hidden></div>
      <div class="choices">
        <button type="button" class="btn choice" data-diff="easy">Easy</button>
        <button type="button" class="btn choice" data-diff="medium">Medium</button>
        <button type="button" class="btn choice" data-diff="hard">Hard</button>
        <button type="button" class="btn choice" data-diff="expert">Expert</button>
      </div>
      <button type="button" class="btn btn-ghost" id="dlgClose">Keep Playing</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
